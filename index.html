<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚠️ Device Lost - Contact Owner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Verdana', sans-serif;
            overflow: hidden;
            position: relative;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0 !important;
            opacity: 0.55;
            pointer-events: none !important;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
            pointer-events: none;
        }

        .scan-line {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            z-index: 2;
            animation: scanMove 5s linear infinite;
            opacity: 0.25;
            box-shadow: 0 0 25px #00f0ff;
            pointer-events: none;
        }
        .scan-line:nth-child(2) {
            animation-delay: 2.5s;
            opacity: 0.08;
            height: 1px;
        }
        .scan-line:nth-child(3) {
            animation-delay: 1.2s;
            opacity: 0.04;
            height: 1px;
            width: 70%;
            left: 15%;
        }

        @keyframes scanMove {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        .ring-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 600px;
        }

        .rotating-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            border: 1px solid rgba(0, 240, 255, 0.05);
            transform: translate(-50%, -50%);
            animation: rotateRing linear infinite;
            pointer-events: none;
        }

        .rotating-ring:nth-child(1) {
            width: 80%;
            height: 80%;
            animation-duration: 20s;
            border-color: rgba(0, 240, 255, 0.03);
        }
        .rotating-ring:nth-child(2) {
            width: 60%;
            height: 60%;
            animation-duration: 15s;
            animation-direction: reverse;
            border-color: rgba(0, 240, 255, 0.04);
            border-style: dashed;
        }
        .rotating-ring:nth-child(3) {
            width: 40%;
            height: 40%;
            animation-duration: 25s;
            border-color: rgba(0, 240, 255, 0.05);
            border-width: 2px;
        }
        .rotating-ring:nth-child(4) {
            width: 20%;
            height: 20%;
            animation-duration: 10s;
            animation-direction: reverse;
            border-color: rgba(0, 240, 255, 0.08);
            border-style: dotted;
            border-width: 2px;
        }

        @keyframes rotateRing {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #00f0ff, transparent);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0.10;
            box-shadow: 0 0 15px #00f0ff;
            pointer-events: none;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.10; }
            100% { transform: translateY(-10vh) scale(1) rotate(720deg); opacity: 0; }
        }

        .corner-brackets {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: rgba(0, 240, 255, 0.15);
            border-style: solid;
            border-width: 0;
            animation: pulseCorner 3s infinite;
            pointer-events: none;
        }

        .corner-tl { top: 20px; left: 20px; border-top-width: 2px; border-left-width: 2px; }
        .corner-tr { top: 20px; right: 20px; border-top-width: 2px; border-right-width: 2px; }
        .corner-bl { bottom: 20px; left: 20px; border-bottom-width: 2px; border-left-width: 2px; }
        .corner-br { bottom: 20px; right: 20px; border-bottom-width: 2px; border-right-width: 2px; }

        @keyframes pulseCorner {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            padding: 25px 24px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            background: transparent;
            border-radius: 20px;
            margin: 20px;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .top-section {
            flex-shrink: 0;
            position: relative;
        }

        .glow-ring {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 120%;
            border: 1px solid rgba(0, 240, 255, 0.05);
            border-radius: 50%;
            animation: ringPulse 3s infinite;
            pointer-events: none;
        }

        @keyframes ringPulse {
            0% { transform: translateX(-50%) scale(1); opacity: 0.2; }
            50% { transform: translateX(-50%) scale(1.08); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 0.2; }
        }

        .owner-name {
            font-size: 2.8rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 700;
            color: #00f0ff;
            text-shadow: 0 0 30px #00f0ff, 0 0 60px #00f0ff, 0 0 100px rgba(0, 240, 255, 0.20), 0 2px 8px rgba(0,0,0,0.9);
            letter-spacing: 5px;
            margin-bottom: 2px;
            animation: pulseText 2.5s infinite;
            line-height: 1.1;
            pointer-events: none;
        }

        .glitch {
            font-size: 1.7rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 700;
            color: #ff0040;
            text-shadow: 0 0 15px #ff0040, 0 0 30px #ff0040, 0 2px 8px rgba(0,0,0,0.9);
            animation: glitch 1.8s infinite;
            letter-spacing: 3px;
            margin-bottom: 2px;
            line-height: 1.2;
            pointer-events: none;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 15px #ff0040, 0 0 30px #ff0040; }
            20% { text-shadow: -2px 0 #00f0ff, 2px 0 #ff0040; transform: skewX(-1deg); }
            40% { text-shadow: 2px 0 #00f0ff, -2px 0 #ff0040; transform: skewX(1deg); }
            60% { text-shadow: 0 0 25px #ff0040, 0 0 50px #ff0040; transform: skewX(0); }
            80% { text-shadow: -1px 0 #ff0040, 1px 0 #00f0ff; transform: skewX(-0.5deg); }
        }

        .sub-glitch {
            color: #00f0ff;
            font-size: 0.95rem;
            font-family: 'Verdana', 'Segoe UI', sans-serif;
            font-weight: 600;
            text-shadow: 0 0 15px #00f0ff, 0 2px 8px rgba(0,0,0,0.9);
            animation: pulseText 2.5s infinite;
            letter-spacing: 4px;
            opacity: 0.9;
            line-height: 1.4;
            pointer-events: none;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 10px;
            font-size: 0.6rem;
            font-family: 'Verdana', 'Segoe UI', sans-serif;
            font-weight: 600;
            color: rgba(0, 240, 255, 0.45);
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            letter-spacing: 1.5px;
            line-height: 1.4;
            animation: statusPulse 3s infinite;
            pointer-events: none;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .status-bar .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00f0ff;
            border-radius: 50%;
            animation: blinkDot 1.2s infinite;
            box-shadow: 0 0 10px #00f0ff;
        }
        .status-bar .dot:nth-child(2) { animation-delay: 0.4s; }
        .status-bar .dot:nth-child(3) { animation-delay: 0.8s; }

        @keyframes blinkDot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .center-gap {
            flex: 1;
            min-height: 10px;
        }

        .bottom-section {
            flex-shrink: 0;
            margin-top: 5px;
        }

        /* ===== PASSWORD SECTION ===== */
        .password-section {
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.50);
            padding: 20px 18px;
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.10);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        /* BLOCKED STATE */
        .password-section.blocked {
            border-color: rgba(255, 0, 64, 0.4);
            box-shadow: 0 0 40px rgba(255, 0, 64, 0.10);
            animation: blockPulse 1s infinite;
        }

        @keyframes blockPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 0, 64, 0.10); }
            50% { box-shadow: 0 0 60px rgba(255, 0, 64, 0.20); }
        }

        .password-section .lock-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: pulseText 2s infinite;
        }

        .password-section .sub-title {
            color: rgba(255, 255, 255, 0.50);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .password-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .password-input-group input {
            width: 100%;
            max-width: 280px;
            padding: 14px 18px;
            background: rgba(0, 240, 255, 0.06);
            border: 2px solid rgba(0, 240, 255, 0.15);
            border-radius: 12px;
            color: #00f0ff;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .password-input-group input:focus {
            border-color: rgba(0, 240, 255, 0.40);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.10);
        }

        .password-input-group input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .password-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.20);
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .password-input-group .btn-unlock {
            padding: 14px 50px;
            background: rgba(0, 240, 255, 0.10);
            border: 2px solid rgba(0, 240, 255, 0.20);
            border-radius: 30px;
            color: #00f0ff;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .password-input-group .btn-unlock:hover:not(:disabled),
        .password-input-group .btn-unlock:active:not(:disabled) {
            background: rgba(0, 240, 255, 0.18);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.10);
            transform: scale(1.02);
        }

        .password-input-group .btn-unlock:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(255, 0, 64, 0.08);
            border-color: rgba(255, 0, 64, 0.15);
            color: rgba(255, 0, 64, 0.6);
        }

        .password-msg {
            margin-top: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            min-height: 25px;
            transition: all 0.3s ease;
        }

        .password-msg.error {
            color: #ff0040;
            animation: shake 0.5s ease;
            text-shadow: 0 0 15px rgba(255, 0, 64, 0.5);
        }

        .password-msg.success {
            color: #51cf66;
            text-shadow: 0 0 15px rgba(0, 255, 100, 0.5);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* ===== COUNTDOWN ===== */
        .countdown {
            color: #ff0040;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 8px;
            animation: pulseText 1s infinite;
            text-shadow: 0 0 15px rgba(255, 0, 64, 0.5);
        }

        /* ===== PROTECTED CONTENT ===== */
        .protected-content {
            display: none;
            animation: fadeIn 0.6s ease;
            background: rgba(0, 0, 0, 0.45);
            padding: 18px 16px;
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .protected-content.show {
            display: block;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .welcome-text {
            color: #00f0ff;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 5px 0 15px;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.30), 0 2px 8px rgba(0,0,0,0.9);
        }

        .reveal-container {
            margin: 12px 0 10px;
            display: flex;
            justify-content: center;
        }

        .reveal-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 20px 30px;
            background: rgba(0, 255, 100, 0.08);
            border: 2px solid rgba(0, 255, 100, 0.20);
            border-radius: 16px;
            color: #51cf66;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            min-width: 200px;
            min-height: 80px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            position: relative;
            z-index: 100;
        }

        .reveal-btn:hover,
        .reveal-btn:active {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(0, 255, 100, 0.15);
            background: rgba(0, 255, 100, 0.12);
        }

        .reveal-btn .icon {
            font-size: 2.5rem;
            pointer-events: none;
        }

        .reveal-btn .label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
        }

        .reveal-btn .sub-label {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.40);
            pointer-events: none;
        }

        .hidden-contact {
            display: none;
            margin: 10px 0 5px;
            padding: 14px 18px;
            background: rgba(0, 255, 100, 0.08);
            border: 1px solid rgba(0, 255, 100, 0.20);
            border-radius: 12px;
            animation: fadeIn 0.5s ease;
        }

        .hidden-contact.show {
            display: block;
        }

        .hidden-contact .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 0;
            color: #00f0ff;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Verdana', 'Segoe UI', sans-serif;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .hidden-contact .contact-item .icn {
            font-size: 1.5rem;
        }

        .hidden-contact .contact-item .num {
            color: #51cf66;
            font-size: 1.1rem;
        }

        .hidden-contact .call-action {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 30px;
            background: rgba(0, 255, 100, 0.10);
            border: 1px solid rgba(0, 255, 100, 0.25);
            border-radius: 30px;
            color: #51cf66;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .hidden-contact .call-action:hover,
        .hidden-contact .call-action:active {
            background: rgba(0, 255, 100, 0.18);
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.15);
        }

        .footer-text {
            color: rgba(0, 240, 255, 0.25);
            font-size: 0.7rem;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            margin-top: 14px;
            animation: pulseText 3s infinite;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .footer-text span {
            color: #ff0040;
            animation: glitch 2s infinite;
        }

        #hint {
            color: rgba(0, 240, 255, 0.30);
            font-size: 0.55rem;
            font-family: 'Verdana', 'Segoe UI', sans-serif;
            font-weight: 500;
            margin-top: 6px;
            animation: pulseText 2s infinite;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 12px 28px;
            border-radius: 30px;
            color: #00f0ff;
            font-family: 'Verdana', 'Segoe UI', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .container { padding: 15px 16px 20px; margin: 10px; }
            .owner-name { font-size: 2.2rem; letter-spacing: 3px; }
            .glitch { font-size: 1.3rem; letter-spacing: 2px; }
            .sub-glitch { font-size: 0.75rem; letter-spacing: 3px; }
            .center-gap { min-height: 5px; }
            .status-bar { font-size: 0.5rem; gap: 10px; }
            .footer-text { font-size: 0.6rem; letter-spacing: 3px; }
            #toast { font-size: 0.6rem; padding: 10px 20px; bottom: 18px; white-space: normal; }
            #hint { font-size: 0.5rem; }
            .corner { width: 25px; height: 25px; }
            .corner-tl { top: 10px; left: 10px; }
            .corner-tr { top: 10px; right: 10px; }
            .corner-bl { bottom: 10px; left: 10px; }
            .corner-br { bottom: 10px; right: 10px; }
            .reveal-btn { padding: 16px 24px; min-width: 160px; min-height: 65px; }
            .reveal-btn .icon { font-size: 2rem; }
            .reveal-btn .label { font-size: 0.7rem; }
            .hidden-contact .contact-item { font-size: 0.85rem; }
            .hidden-contact .contact-item .num { font-size: 0.95rem; }
            .hidden-contact .call-action { padding: 8px 20px; font-size: 0.7rem; }
            .password-input-group input { padding: 12px 14px; font-size: 1rem; max-width: 220px; }
            .password-input-group .btn-unlock { padding: 12px 30px; font-size: 0.75rem; }
            .password-section .lock-icon { font-size: 2.5rem; }
            .password-section { padding: 16px 14px; }
            .protected-content { padding: 14px 12px; }
            .welcome-text { font-size: 1rem; }
        }

        @media (max-width: 380px) {
            .owner-name { font-size: 1.6rem; letter-spacing: 2px; }
            .glitch { font-size: 1.0rem; letter-spacing: 1px; }
            .sub-glitch { font-size: 0.6rem; letter-spacing: 2px; }
            .reveal-btn { padding: 12px 18px; min-width: 130px; min-height: 55px; }
            .reveal-btn .icon { font-size: 1.6rem; }
            .reveal-btn .label { font-size: 0.6rem; }
            .hidden-contact .contact-item { font-size: 0.75rem; }
            .hidden-contact .contact-item .num { font-size: 0.8rem; }
            .hidden-contact .call-action { padding: 6px 16px; font-size: 0.6rem; }
            .password-input-group input { padding: 10px 12px; font-size: 0.9rem; max-width: 180px; }
            .password-input-group .btn-unlock { padding: 10px 20px; font-size: 0.65rem; }
            .password-section .lock-icon { font-size: 2rem; }
            .welcome-text { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="scanner.webm" type="video/webm">
    </video>

    <div class="overlay"></div>

    <div class="scan-line"></div>
    <div class="scan-line"></div>
    <div class="scan-line"></div>

    <div class="ring-container">
        <div class="rotating-ring"></div>
        <div class="rotating-ring"></div>
        <div class="rotating-ring"></div>
        <div class="rotating-ring"></div>
    </div>

    <div id="particles"></div>

    <div class="corner-brackets">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
    </div>

    <div id="toast">▶ SYSTEM READY</div>

    <!-- ===== AUDIO FILES ===== -->
    <audio id="passNoAudio" src="passno.wav" preload="auto"></audio>
    <audio id="passYesAudio" src="passyes.wav" preload="auto"></audio>

    <div class="container">

        <div class="top-section">
            <div class="glow-ring"></div>
            <div class="owner-name">✦ SANIL ✦</div>
            <div class="glitch">⚠️ DEVICE LOST</div>
            <div class="sub-glitch">◆ CONTACT OWNER ◆</div>

            <div class="status-bar">
                <span><span class="dot"></span> SECURE</span>
                <span><span class="dot"></span> ENCRYPTED</span>
                <span><span class="dot"></span> TRACKING</span>
            </div>
        </div>

        <div class="center-gap"></div>

        <div class="bottom-section">

            <!-- ===== PASSWORD SECTION ===== -->
            <div class="password-section" id="passwordSection">
                <div class="lock-icon" id="lockIcon">🔒</div>
                <div class="sub-title" id="subTitle">ENTER OWNER PASSWORD</div>
                <div class="password-input-group">
                    <input type="password" id="passwordInput" placeholder="Enter password" maxlength="20" autocomplete="off">
                    <button class="btn-unlock" id="unlockBtn">▶ UNLOCK</button>
                </div>
                <div class="password-msg" id="passwordMsg"></div>
                <div class="countdown" id="countdown"></div>
            </div>

            <!-- ===== PROTECTED CONTENT ===== -->
            <div class="protected-content" id="protectedContent">

                <div class="welcome-text">
                    👋 Welcome Sanil
                </div>

                <div class="reveal-container">
                    <div class="reveal-btn" id="revealBtn">
                        <span class="icon">🔒</span>
                        <span class="label">TAP TO REVEAL</span>
                        <span class="sub-label">Show contact details</span>
                    </div>
                </div>

                <div class="hidden-contact" id="hiddenContact">
                    <div class="contact-item">
                        <span class="icn">📱</span>
                        <span>Call Owner:</span>
                        <span class="num">+91 8921357062</span>
                    </div>
                    <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
                        <a href="tel:+918921357062" class="call-action">📞 CALL NOW</a>
                        <a href="https://wa.me/918921357062" target="_blank" class="call-action" style="border-color:rgba(0,255,200,0.25); color:#20c997;">💬 WHATSAPP</a>
                    </div>
                </div>

            </div>

            <div class="footer-text">
                ═══ <span>◆</span> SCAN COMPLETE <span>◆</span> ═══
            </div>

            <div id="hint">🔑 Enter password to unlock</div>

        </div>

    </div>

    <script>
        var video = document.getElementById('bg-video');

        function unmuteVideo() {
            video.muted = false;
            video.play().catch(function() {});
        }

        document.addEventListener('click', unmuteVideo);
        document.addEventListener('touchstart', unmuteVideo);

        video.muted = false;
        video.play().catch(function() {
            video.muted = true;
            video.play();
        });

        var particlesContainer = document.getElementById('particles');
        for (var i = 0; i < 30; i++) {
            var particle = document.createElement('div');
            particle.className = 'particle';
            var size = Math.random() * 4 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 18 + 12) + 's';
            particle.style.animationDelay = (Math.random() * 25) + 's';
            particlesContainer.appendChild(particle);
        }

        var toast = document.getElementById('toast');
        var toastTimer = null;

        function showToast(message) {
            toast.textContent = '▶ ' + message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================
        // AUDIO FILES
        // ============================================
        var passNoAudio = document.getElementById('passNoAudio');
        var passYesAudio = document.getElementById('passYesAudio');

        function playAudio(audioEl) {
            try {
                audioEl.currentTime = 0;
                var playPromise = audioEl.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(err) {
                        console.log('Audio play failed:', err);
                    });
                }
            } catch(e) {
                console.log('Audio error:', e);
            }
        }

        // ============================================
        // PASSWORD SYSTEM
        // ============================================
        var CORRECT_PASSWORD = 'itsmebg';
        var passwordInput = document.getElementById('passwordInput');
        var unlockBtn = document.getElementById('unlockBtn');
        var passwordMsg = document.getElementById('passwordMsg');
        var passwordSection = document.getElementById('passwordSection');
        var protectedContent = document.getElementById('protectedContent');
        var hint = document.getElementById('hint');
        var lockIcon = document.getElementById('lockIcon');
        var subTitle = document.getElementById('subTitle');
        var countdownEl = document.getElementById('countdown');
        var isUnlocked = false;
        var isBlocked = false;
        var blockTimer = null;
        var countdownTimer = null;

        // ============================================
        // BLOCK INPUT FOR 5 SECONDS
        // ============================================
        function blockInput() {
            isBlocked = true;
            var secondsLeft = 5;

            passwordInput.disabled = true;
            unlockBtn.disabled = true;
            passwordSection.classList.add('blocked');
            lockIcon.textContent = '🚫';
            subTitle.textContent = 'ACCESS DENIED';

            countdownEl.textContent = '⏳ Try again in ' + secondsLeft + 's';
            countdownEl.style.display = 'block';

            countdownTimer = setInterval(function() {
                secondsLeft--;
                if (secondsLeft > 0) {
                    countdownEl.textContent = '⏳ Try again in ' + secondsLeft + 's';
                } else {
                    countdownEl.textContent = '✅ You can try again now';
                    setTimeout(function() {
                        countdownEl.style.display = 'none';
                    }, 800);
                }
            }, 1000);

            blockTimer = setTimeout(function() {
                isBlocked = false;
                passwordInput.disabled = false;
                unlockBtn.disabled = false;
                passwordSection.classList.remove('blocked');
                lockIcon.textContent = '🔒';
                subTitle.textContent = 'ENTER OWNER PASSWORD';
                passwordInput.focus();
                passwordMsg.textContent = '';
                passwordMsg.className = 'password-msg';
                passwordInput.style.borderColor = '';
                passwordInput.style.boxShadow = '';
                clearInterval(countdownTimer);
            }, 5000);
        }

        // ============================================
        // CHECK PASSWORD
        // ============================================
        function checkPassword() {
            if (isBlocked) return;

            var entered = passwordInput.value.trim();

            if (entered === CORRECT_PASSWORD) {
                // ===== CORRECT PASSWORD =====
                isUnlocked = true;

                // Play YES sound
                playAudio(passYesAudio);

                passwordMsg.textContent = '✅ Access Granted! Welcome Sanil!';
                passwordMsg.className = 'password-msg success';
                passwordInput.style.borderColor = 'rgba(0, 255, 100, 0.50)';
                passwordInput.style.boxShadow = '0 0 30px rgba(0, 255, 100, 0.15)';
                lockIcon.textContent = '🔓';
                subTitle.textContent = 'ACCESS GRANTED';

                passwordSection.style.opacity = '0';
                passwordSection.style.transition = 'opacity 0.5s ease';
                setTimeout(function() {
                    passwordSection.style.display = 'none';
                    protectedContent.classList.add('show');
                    hint.textContent = '👆 Tap button above to reveal contact';
                    showToast('✅ ACCESS GRANTED');
                    if (navigator.vibrate) navigator.vibrate(20);
                }, 800);

            } else {
                // ===== WRONG PASSWORD =====
                passwordMsg.textContent = '❌ Password not matching, try again';
                passwordMsg.className = 'password-msg error';
                passwordInput.style.borderColor = 'rgba(255, 0, 64, 0.50)';
                passwordInput.style.boxShadow = '0 0 30px rgba(255, 0, 64, 0.15)';
                passwordInput.value = '';

                // Play NO sound
                playAudio(passNoAudio);

                if (navigator.vibrate) navigator.vibrate(50);

                // Block for 5 seconds
                blockInput();
            }
        }

        unlockBtn.addEventListener('click', checkPassword);

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !isBlocked) {
                checkPassword();
            }
        });

        passwordInput.addEventListener('focus', function() {
            if (!isBlocked) {
                passwordMsg.textContent = '';
                passwordMsg.className = 'password-msg';
                passwordInput.style.borderColor = '';
                passwordInput.style.boxShadow = '';
            }
        });

        // ============================================
        // REVEAL CONTACT
        // ============================================
        var revealBtn = document.getElementById('revealBtn');
        var hiddenContact = document.getElementById('hiddenContact');
        var isRevealed = false;

        revealBtn.addEventListener('click', function() {
            if (!isRevealed && isUnlocked) {
                hiddenContact.classList.add('show');
                revealBtn.innerHTML = `
                    <span class="icon">🔓</span>
                    <span class="label">CONTACT REVEALED</span>
                    <span class="sub-label">Tap below to call or WhatsApp</span>
                `;
                revealBtn.style.borderColor = 'rgba(0, 255, 100, 0.5)';
                revealBtn.style.background = 'rgba(0, 255, 100, 0.15)';
                isRevealed = true;
                showToast('📱 CONTACT REVEALED');
                if (navigator.vibrate) navigator.vibrate(20);
            }
        });

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'c' || e.key === 'p')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });

        window.addEventListener('load', function() {
            setTimeout(function() {
                showToast('🔒 ENTER PASSWORD TO UNLOCK');
            }, 600);
            console.log('✅ Sci-Fi Contact Page - Audio Enabled');
            console.log('🔑 Password: itsmebg');
            console.log('🔊 passno.wav = wrong password');
            console.log('🔊 passyes.wav = correct password');
        });
    </script>

</body>
</html>
