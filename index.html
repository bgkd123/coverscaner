<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner</title>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }
        video { 
            max-width: 100%; 
            max-height: 100%; 
            pointer-events: none; /* Prevents right-click on video */
        }
        /* Full page overlay to catch all right-clicks */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            cursor: default;
        }
    </style>
</head>
<body>

    <!-- Overlay to block right-click everywhere -->
    <div id="overlay"></div>

    <video id="v" autoplay loop muted playsinline>
        <source src="scanner.webm" type="video/webm">
    </video>

    <script>
        const v = document.getElementById('v');

        // Block right-click globally
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });

        // Block keyboard shortcuts (Ctrl+S, Ctrl+U, etc.)
        document.addEventListener('keydown', (e) => {
            // Ctrl+S, Ctrl+U, Ctrl+C, F12
            if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'c' || e.key === 'p')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });

        // Unmute on click/tap
        document.addEventListener('click', () => { 
            v.muted = false; 
            v.play(); 
        });
        document.addEventListener('touchstart', () => { 
            v.muted = false; 
            v.play(); 
        });

        // Try autoplay
        v.muted = false;
        v.play().catch(() => { 
            v.muted = true; 
            v.play(); 
        });
    </script>

</body>
</html>
